<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Tic Tac Toe</title>
    <style>
      body { margin: 0; background: #000; color: #ddd; font: 16px/1.35 ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
      main { width: 31ch; max-width: 100%; margin: 0 auto; padding: 1.5rem 0 3rem; }
      pre { margin: 0; white-space: pre; }
      .x { color: #56d4dd; }
      .o { color: #ff9d2e; }
      .card { color: #e8e8e8; }
      .dim { color: #888; }
      .gold { color: #f5b942; }
      .x.hot { background: #56d4dd; color: #111; }
      .o.hot { background: #ff9d2e; color: #111; }
      .card.hot { background: #e8e8e8; color: #111; }
      #status { width: 31ch; max-width: 100%; box-sizing: border-box; color: #fff; padding: 0.15rem 0.4rem; text-align: center; }
      #status.select, #status.draw { background: #444; color: #ddd; }
      #status.play { background: #ca8a00; color: #111; }
      #status.win { background: #1f7a3a; }
      #status.lose { background: #b00000; }
      #back { margin-top: 0.35rem; }
      .opt, .cell { cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <pre id="screen"></pre>
      <div id="status"></div>
      <div id="back" class="dim"></div>
    </main>
    <script src="./main.js" defer></script>
  </body>
</html>
