<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Loop Song</title>
    <style>
      body { margin: 0; background: #000; color: #ddd; font: 16px/1.35 ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
      main { width: 39ch; max-width: 100%; margin: 0 auto; padding: 1.5rem 0 3rem; }
      pre { margin: 0; white-space: pre; }
      /* 200x200 is YouTube's documented player minimum; smaller risks silent playback failure. */
      #player-note { text-align: center; margin-bottom: 0.35rem; }
      #player { display: block; width: 200px; max-width: 100%; height: 200px; background: #000; margin: 0 auto 1rem; }
      .url { color: #56d4dd; }
      .time { color: #ff9d2e; }
      .gold { color: #f5b942; }
      .card { color: #e8e8e8; }
      .dim { color: #888; }
      .good { color: #3fb950; }
      .bad { color: #f85149; }
      .url.hot { background: #56d4dd; color: #111; }
      .time.hot { background: #ff9d2e; color: #111; }
      .gold.hot { background: #f5b942; color: #111; }
      .card.hot { background: #e8e8e8; color: #111; }
      .good.hot { background: #3fb950; color: #111; }
      .bad.hot { background: #f85149; color: #111; }
      .dim.hot { background: #888; color: #111; }
      #back { margin-top: 0.35rem; }
      .btn, .loop { cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <div id="player-note" class="dim">(IFrame, because TOS)</div>
      <div id="player"></div>
      <pre id="screen"></pre>
      <div id="back" class="dim"></div>
    </main>
    <script src="./main.js" defer></script>
  </body>
</html>
