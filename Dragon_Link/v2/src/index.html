<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Autumn Moon</title>
    <style>
      body { margin: 0; background: #000; color: #ddd; font: 16px/1.35 ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
      main { width: 53ch; max-width: 100%; margin: 0 auto; padding: 1.5rem 0 3rem; }
      pre { margin: 0; white-space: pre; }
      .card { color: #e8e8e8; }
      .fan, .gold { color: #f5b942; }
      .koi { color: #ff7a59; }
      .lotus { color: #ff8fd1; }
      .dragon, .grand { color: #ff5a5a; }
      .wild, .moon { color: #ffe066; }
      .orb { color: #ff9d2e; }
      .mini { color: #6fdc6f; }
      .minor, .door { color: #7aa7ff; }
      .major { color: #e08bff; }
      .dim, .spin { color: #888; }
      .hit { background: #fff; color: #111; }
      .lock { box-shadow: inset 0 0 0 1px currentColor; }
      .banner { color: #fff; }
      #status { width: 53ch; max-width: 100%; box-sizing: border-box; color: #fff; padding: 0.15rem 0.4rem; text-align: center; }
      #status.play, #status.win, .banner.play, .banner.win { background: #1f7a3a; }
      #status.free, .banner.free { background: #1d4f8a; }
      #status.door, .banner.door { background: #2f6fdb; }
      #status.hold, .banner.hold { background: #c45c00; }
      #status.major, .banner.major { background: #6b2d91; }
      #status.grand, .banner.grand { background: #b00000; }
      #status.spin, .banner.spin { background: #6a5420; color: #ffe066; }
      #status.broke, .banner.broke { background: #444; }
      p { color: #888; font-size: 0.85rem; }
      article { color: #ccc; margin-top: 2rem; line-height: 1.55; font-size: 0.9rem; border-top: 1px solid #333; }
      article h2 { color: #f5b942; font-size: 1rem; }
      table { border-collapse: collapse; margin-top: 1rem; }
      th, td { border: 1px solid #333; padding: 0.25rem 0.6rem; text-align: right; }
      th:first-child { text-align: left; }
    </style>
  </head>
  <body>
    <main>
      <pre id="screen"></pre>
      <div id="status"></div>
      <p>Enter = Spin, Arrows = Coin, Esc or R = Reset</p>
      <article id="rules"></article>
    </main>
    <script src="./main.js" defer></script>
  </body>
</html>
