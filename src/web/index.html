<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Autumn Moon: an unofficial parody</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        background: #000;
        color: #ddd;
        font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      }
      main {
        max-width: 46rem;
        margin: 0 auto;
        padding: 1.5rem 1rem 3rem;
      }
      h1 {
        color: #f5b942;
        font-size: 1.3rem;
        text-align: center;
        letter-spacing: 0.1em;
      }
      #meters {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 0.5rem;
        text-align: center;
        margin-bottom: 1rem;
      }
      #meters div {
        border: 1px solid #333;
        padding: 0.4rem;
      }
      #meters span {
        display: block;
        font-size: 0.75rem;
        letter-spacing: 0.15em;
      }
      .m-grand { color: #ff5a5a; }
      .m-major { color: #d77bff; }
      .m-minor { color: #5aa0ff; }
      .m-mini { color: #6fdc6f; }
      #board {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 4px;
        border: 2px solid #5a3b12;
        padding: 4px;
        background: #0b0b0b;
      }
      .tile {
        height: 3.4rem;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #141414;
        font-weight: bold;
        font-size: 0.95rem;
      }
      .t-card { color: #e6e6e6; }
      .t-fan { color: #f2c94c; }
      .t-koi { color: #ff7a59; }
      .t-lotus { color: #ff8fd1; }
      .t-dragon { color: #ff5a5a; }
      .t-wild { color: #f5b942; }
      .t-moon { color: #ffe066; background: #26200a; }
      .t-orb { color: #ff9d2e; background: #2a1600; }
      .t-jackpot { color: #e08bff; background: #22072e; }
      .t-door { color: #7aa7ff; background: #0c1a33; }
      .t-blank { color: #333; }
      .look-spinning { color: #444; background: #101010; }
      .look-spinning::after { content: "▒▒▒"; }
      .look-locked { outline: 1px solid currentColor; }
      .look-win { filter: invert(1); }
      #stats {
        display: flex;
        justify-content: space-between;
        margin: 1rem 0 0.5rem;
      }
      #stats b { color: #fff; }
      #banner {
        min-height: 1.5em;
        text-align: center;
        color: #ffe066;
        font-weight: bold;
        letter-spacing: 0.08em;
      }
      #prompt {
        text-align: center;
        color: #888;
        font-size: 0.85rem;
        min-height: 1.3em;
      }
      nav {
        display: flex;
        gap: 0.5rem;
        justify-content: center;
        margin: 1rem 0 2rem;
      }
      button {
        font: inherit;
        background: #1c1c1c;
        color: #eee;
        border: 1px solid #555;
        padding: 0.5rem 1rem;
        cursor: pointer;
      }
      button:disabled { opacity: 0.4; cursor: default; }
      body[data-prompt="spin"] button[data-action="spin"],
      body[data-prompt="confirm"] button[data-action="confirm"] {
        border-color: #f5b942;
        color: #f5b942;
      }
      article {
        border-top: 1px solid #333;
        line-height: 1.55;
        font-size: 0.9rem;
      }
      article h2 { color: #f5b942; font-size: 1rem; }
      table { border-collapse: collapse; margin-top: 1rem; }
      th, td { border: 1px solid #333; padding: 0.25rem 0.6rem; text-align: right; }
      th:first-child { text-align: left; }
    </style>
  </head>
  <body>
    <main>
      <h1>AUTUMN MOON · unofficial parody</h1>
      <section id="meters">
        <div class="m-grand"><span>GRAND</span><b id="grand"></b></div>
        <div class="m-major"><span>MAJOR</span><b id="major"></b></div>
        <div class="m-minor"><span>MINOR</span><b id="minor"></b></div>
        <div class="m-mini"><span>MINI</span><b id="mini"></b></div>
      </section>
      <div id="board"></div>
      <section id="stats">
        <span>CREDITS <b id="credits"></b></span>
        <span>BET <b id="bet"></b></span>
        <span>WIN <b id="win"></b></span>
      </section>
      <div id="banner"></div>
      <div id="prompt"></div>
      <nav>
        <button data-action="coinDown">COIN −</button>
        <button data-action="spin">SPIN</button>
        <button data-action="confirm">COLLECT</button>
        <button data-action="coinUp">COIN +</button>
      </nav>
      <article id="rules">{{rules}}</article>
    </main>
    <script src="./main.js" defer></script>
  </body>
</html>
